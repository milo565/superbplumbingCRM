services:
  postgres:
    image: postgres:16-alpine
    container_name: kaizen-coastal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kaizen
      POSTGRES_PASSWORD: kaizen
      POSTGRES_DB: kaizen
    ports:
      - "5432:5432"
    volumes:
      - kaizen_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaizen -d kaizen"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kaizen_pg:
